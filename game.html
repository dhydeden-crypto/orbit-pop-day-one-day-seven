<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Pop — Day one, day seven</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b1e;color:#fff;font-family:system-ui,sans-serif}
  #wrap{max-width:540px;margin:0 auto;text-align:center}
  canvas{width:100%;height:auto;display:block;background:#0b0b1e;touch-action:none}
  .bar{display:flex;justify-content:space-between;padding:12px 16px;font-weight:700}
  button{margin:6px;padding:10px 14px;border-radius:999px;border:0;background:#c41c83;color:#fff;font-weight:700;cursor:pointer}
  p{padding:0 16px;color:#c9c9e8}
</style>
</head>
<body>
<div id="wrap">
  <div class="bar"><span>ORBIT POP</span><span id="day">DAY 1</span><span>Score <b id="score">0</b></span></div>
  <canvas id="c" width="1080" height="1500"></canvas>
  <div>
    <button id="d1">Day 1</button>
    <button id="d7">Day 7</button>
  </div>
  <p>Move with arrow keys or drag. Collect the yellow stars on the ring. Day 7 adds enemies, power-ups and particles — same map, same start.</p>
</div>
<script>
// Orbit Pop — a tiny ring game. One fixed map, one fixed start angle.
// Day 1: 5 stars, no enemies, plain. Day 7: 18 stars, 4 enemies, 3 power-ups, particles.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const CX = 540, CY = 750, R = 360;
let mode = 'day1', angle = -Math.PI / 2, score = 0, t = 0;
let keys = {};
const starsDay1 = [0, 1.3, 2.6, 3.9, 5.2].map(a => ({a, got:false}));
const starsDay7 = Array.from({length:18}, (_,i)=>({a:i*2*Math.PI/18, got:false}));
const enemies = [0.8, 2.4, 4.0, 5.5].map(a=>({a, speed:-0.35}));
const powers = [1.0, 3.1, 5.0].map(a=>({a, got:false}));
let parts = [];
function stars(){ return mode==='day1' ? starsDay1 : starsDay7; }
function draw(){
  ctx.fillStyle='#0b0b1e'; ctx.fillRect(0,0,1080,1500);
  // background stars
  ctx.fillStyle='#ffffff';
  for(let i=0;i<90;i++){ const x=(i*173)%1080, y=(i*311)%1500; ctx.globalAlpha=0.25+(i%3)*0.2; ctx.fillRect(x,y,3,3); }
  ctx.globalAlpha=1;
  // orbit ring
  ctx.strokeStyle='#c41c83'; ctx.lineWidth=10;
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(CX,CY,R-60,0,Math.PI*2); ctx.stroke();
  // stars
  for(const s of stars()){
    if(s.got) continue;
    const x=CX+Math.cos(s.a)*R, y=CY+Math.sin(s.a)*R;
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(x,y,22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#191419'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('★',x,y+1);
  }
  if(mode==='day7'){
    for(const p of powers()){
      if(p.got) continue;
      const x=CX+Math.cos(p.a)*(R-60), y=CY+Math.sin(p.a)*(R-60);
      ctx.fillStyle='#2ee6a8'; ctx.beginPath(); ctx.arc(x,y,26,0,Math.PI*2); ctx.fill();
    }
    for(const e of enemies){
      const x=CX+Math.cos(e.a)*R, y=CY+Math.sin(e.a)*R;
      ctx.fillStyle='#ff3b5c'; ctx.beginPath(); ctx.arc(x,y,28,0,Math.PI*2); ctx.fill();
    }
    for(const p of parts){
      ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // player
  const px=CX+Math.cos(angle)*R, py=CY+Math.sin(angle)*R;
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(px,py,34,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c41c83'; ctx.beginPath(); ctx.arc(px,py,20,0,Math.PI*2); ctx.fill();
  // HUD
  ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.font='bold 44px sans-serif';
  ctx.fillText(mode==='day1' ? 'DAY 1 — 5 stars' : 'DAY 7 — 18 stars • enemies • power-ups', 40, 90);
}
function step(){
  t+=1/60;
  if(keys.ArrowLeft||keys.a) angle-=0.045;
  if(keys.ArrowRight||keys.d) angle+=0.045;
  angle+=0.008; // slow auto-orbit so the game is watchable
  for(const s of stars()){
    if(!s.got){
      const sx=CX+Math.cos(s.a)*R, sy=CY+Math.sin(s.a)*R;
      const px=CX+Math.cos(angle)*R, py=CY+Math.sin(angle)*R;
      if(Math.hypot(sx-px,sy-py)<55){ s.got=true; score+=10;
        if(mode==='day7') for(let i=0;i<10;i++) parts.push({x:sx,y:sy,r:4+Math.random()*6,life:1,color:'#ffd23f'});
        document.getElementById('score').textContent=score;
      }
    }
  }
  if(mode==='day7'){
    for(const e of enemies) e.a+=e.speed/60;
    parts=parts.map(p=>({...p,life:p.life-0.02})).filter(p=>p.life>0);
  }
  draw();
  requestAnimationFrame(step);
}
function setMode(m){ mode=m; score=0; angle=-Math.PI/2; parts=[];
  starsDay1.forEach(s=>s.got=false); starsDay7.forEach(s=>s.got=false); powers.forEach(s=>s.got=false);
  document.getElementById('day').textContent=m==='day1'?'DAY 1':'DAY 7';
  document.getElementById('score').textContent='0';
}
document.getElementById('d1').onclick=()=>setMode('day1');
document.getElementById('d7').onclick=()=>setMode('day7');
addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);
cv.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*1080, y=(e.clientY-r.top)/r.height*1500; angle=Math.atan2(y-CY,x-CX); });
draw(); step();
</script>
</body>
</html>
